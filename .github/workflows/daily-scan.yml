name: Daily Job Scan

on:
  # 8:00 AM IST = 02:30 UTC
  schedule:
    - cron: '30 2 * * *'
  # Manual trigger with optional dry-run
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip email + pipeline write, log only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    name: Discover · Score · Digest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write   # needed to git push memory + tracker back

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Install Playwright browser ────────────────────────────────────────
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # ── 5. Run agent loop ─────────────────────────────────────────────────────
      - name: Run agent loop (goal-sync → discover → score → pipeline)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node agent/loop.mjs

      # ── 6. Send email digest ──────────────────────────────────────────────────
      - name: Send email digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node send-digest.mjs

      # ── 7. Commit updated state back to repo ──────────────────────────────────
      - name: Commit agent state back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "career-ops-agent[bot]"
          git config user.email "career-ops-agent@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          git add data/memory.json data/tracker.tsv data/results.json || true
          git add interview-prep/story-bank.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "agent run ${DATE} — $(git diff --cached --stat | tail -1)"
            # Discard any remaining working-tree changes so rebase never aborts
            git reset --hard HEAD
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "Changes committed and pushed."
          fi
